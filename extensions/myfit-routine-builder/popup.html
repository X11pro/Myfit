<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Myfit Routine Builder</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-page">
    <main class="app-shell">
      <header class="topbar">
        <h1><span class="brand-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43 1.43 1.43 2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/>
        </svg></span> Myfit <span class="builder-tag">Builder</span></h1>
        <div class="top-actions">
          <span id="cloud-state" class="pill" hidden></span>
          <button id="open-settings" class="icon-button" type="button" aria-label="Connection settings" title="Connection settings">⚙</button>
          <button id="sign-out" class="icon-button" type="button" aria-label="Sign out" title="Sign out" hidden>⇥</button>
        </div>
      </header>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="setup-view" class="card" hidden>
        <h2>Connect Myfit</h2>
        <p>Add your project's public Supabase details before signing in.</p>
        <button id="open-options" class="primary-button" type="button">Open connection settings</button>
      </section>

      <section id="auth-view" class="card" hidden>
        <h2>Sign in to sync</h2>
        <p>Use the same email as in Myfit. We will send a one-time code.</p>
        <form id="email-form" novalidate>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p id="email-error" class="field-error" role="alert"></p>
          <button class="primary-button" type="submit">Send code</button>
        </form>
        <form id="code-form" novalidate hidden>
          <label for="code">One-time code</label>
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required>
          <p id="code-error" class="field-error" role="alert"></p>
          <button class="primary-button" type="submit">Verify and continue</button>
          <button id="change-email" class="text-button" type="button">Use a different email</button>
        </form>
      </section>

      <section id="builder-view" hidden>
        <section class="routine-toolbar" aria-label="Routine selection">
          <div class="routine-select-row">
            <select id="routine-select" aria-label="Active routine"></select>
            <button id="new-routine" class="secondary-button" type="button">＋ New</button>
          </div>
          <nav id="day-tabs" class="day-tabs" aria-label="Training day"></nav>
        </section>
        <section class="day-heading">
          <h2 id="day-title">Monday</h2>
          <span id="day-stats" class="day-stats"></span>
        </section>
        <div class="editor-scroll">
          <div id="blocks" class="blocks"></div>
          <p id="empty-day" class="empty-state">No blocks planned for this day.</p>
          <button id="add-block" class="secondary-button" type="button">＋ Add exercise block</button>
        </div>
        <footer class="builder-footer">
          <div class="footer-actions">
            <button id="save-library" class="primary-button" type="button">☁ Push Routine to Mobile</button>
            <button id="routine-settings" class="secondary-button" type="button">Routine</button>
          </div>
          <div class="footer-meta"><span><kbd id="save-shortcut">Ctrl S</kbd> Save · <kbd>Tab</kbd> Next field</span><span id="account-email"></span></div>
        </footer>
      </section>
      <dialog id="routine-dialog" aria-labelledby="routine-dialog-title">
        <form method="dialog">
          <h2 id="routine-dialog-title">Routine settings</h2>
          <label for="routine-name">Routine name</label>
          <input id="routine-name" type="text" maxlength="80" required>
          <div class="dialog-actions">
            <button id="delete-routine" class="danger-button" type="button">Delete routine</button>
            <button class="secondary-button" value="cancel" formnovalidate>Cancel</button>
            <button class="primary-button" value="apply">Apply</button>
          </div>
        </form>
      </dialog>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
