<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Myfit Routine Builder</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MYFIT / TRAINING</p>
          <h1>Routine builder</h1>
        </div>
        <button id="sign-out" class="text-button" type="button" hidden>Sign out</button>
      </header>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="setup-view" class="card" hidden>
        <h2>Connect Myfit</h2>
        <p>Add your project's public Supabase details before signing in.</p>
        <button id="open-options" class="primary-button" type="button">Open connection settings</button>
      </section>

      <section id="auth-view" class="card" hidden>
        <h2>Sign in to sync</h2>
        <p>Use the same email as in Myfit. We will send a one-time code.</p>
        <form id="email-form" novalidate>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p id="email-error" class="field-error" role="alert"></p>
          <button class="primary-button" type="submit">Send code</button>
        </form>
        <form id="code-form" novalidate hidden>
          <label for="code">One-time code</label>
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required>
          <p id="code-error" class="field-error" role="alert"></p>
          <button class="primary-button" type="submit">Verify and continue</button>
          <button id="change-email" class="text-button" type="button">Use a different email</button>
        </form>
      </section>

      <section id="builder-view" hidden>
        <div class="sync-row">
          <span id="account-email"></span>
          <button id="save-library" class="primary-button" type="button">Save changes</button>
        </div>
        <section class="card routine-toolbar" aria-label="Routine selection">
          <label for="routine-select">Active routine</label>
          <div class="routine-select-row">
            <select id="routine-select"></select>
            <button id="delete-routine" class="danger-button" type="button">Delete</button>
          </div>
          <label for="routine-name">Routine name</label>
          <input id="routine-name" type="text" maxlength="80">
          <button id="new-routine" class="secondary-button" type="button">New routine</button>
        </section>

        <nav id="day-tabs" class="day-tabs" aria-label="Training day"></nav>
        <section class="day-heading">
          <div>
            <p class="eyebrow">SCHEDULE</p>
            <h2 id="day-title">Monday</h2>
          </div>
          <button id="add-block" class="secondary-button" type="button">Add exercise block</button>
        </section>
        <div id="blocks" class="blocks"></div>
        <p id="empty-day" class="empty-state">No exercises for this day yet.</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
